name: Deploy Profito to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Fetch the published commit
        env:
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          git init site
          git -C site remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -C site fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git -C site checkout --detach "${GITHUB_SHA}"

      - name: Package the Pages artifact
        run: |
          tar \
            --dereference \
            --hard-dereference \
            --directory site \
            --create \
            --verbose \
            --file "${RUNNER_TEMP}/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Upload the Pages artifact
        id: upload
        run: |
          mkdir -p "${RUNNER_TEMP}/pages-tools"
          cd "${RUNNER_TEMP}/pages-tools"
          npm install --silent --no-audit --no-fund @actions/artifact@6.2.1

          node --input-type=module <<'NODE'
          import { DefaultArtifactClient } from '@actions/artifact'
          import { appendFileSync } from 'node:fs'
          import { join } from 'node:path'

          const temporaryDirectory = process.env.RUNNER_TEMP
          const archive = join(temporaryDirectory, 'artifact.tar')
          const client = new DefaultArtifactClient()
          const result = await client.uploadArtifact(
            'github-pages',
            Array.of(archive),
            temporaryDirectory,
            { retentionDays: 1 }
          )

          console.log(`Uploaded Pages artifact ${result.id}.`)
          appendFileSync(process.env.GITHUB_OUTPUT, `artifact_id=${result.id}\n`)
          NODE

      - name: Create the Pages deployment
        id: deploy
        env:
          API_URL: ${{ github.api_url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          oidc_response="$(curl --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          oidc_token="$(printf '%s' "${oidc_response}" | jq --raw-output '.value')"

          payload="$(jq --null-input \
            --argjson artifact_id "${ARTIFACT_ID}" \
            --arg pages_build_version "${GITHUB_SHA}" \
            --arg oidc_token "${oidc_token}" \
            '{artifact_id: $artifact_id, pages_build_version: $pages_build_version, oidc_token: $oidc_token}')"

          http_status="$(curl --silent --show-error \
            --output deployment.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${TOKEN}" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "${payload}" \
            "${API_URL}/repos/${REPOSITORY}/pages/deployments")"

          cat deployment.json

          case "${http_status}" in
            200|201) ;;
            *) echo "Pages deployment request failed with HTTP ${http_status}."; exit 1 ;;
          esac

          page_url="$(jq --raw-output '.page_url // empty' deployment.json)"
          status_url="$(jq --raw-output '.status_url // empty' deployment.json)"

          echo "page_url=${page_url}" >> "${GITHUB_OUTPUT}"

          for attempt in $(seq 1 120); do
            curl --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${status_url}" \
              --output deployment-status.json

            deployment_status="$(jq --raw-output '.status // empty' deployment-status.json)"
            echo "Attempt ${attempt}: deployment status=${deployment_status}"

            case "${deployment_status}" in
              succeed) exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                cat deployment-status.json
                exit 1
                ;;
            esac

            sleep 5
          done

          cat deployment-status.json
          echo "Pages deployment did not finish in time."
          exit 1
