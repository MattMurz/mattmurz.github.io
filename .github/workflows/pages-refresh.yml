name: Refresh GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write

jobs:
  request-pages-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Request a Pages build
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/pages/builds")"

          cat response.json

          if test "${status}" != "201"; then
            echo "Pages build request failed with HTTP ${status}."
            exit 1
          fi

      - name: Wait for the requested build
        env:
          API_URL: ${{ github.api_url }}
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 36); do
            curl --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${REPOSITORY}/pages/builds/latest" \
              --output latest-build.json

            build_status="$(jq --raw-output '.status // empty' latest-build.json)"
            build_commit="$(jq --raw-output '.commit // empty' latest-build.json)"
            echo "Attempt ${attempt}: status=${build_status} commit=${build_commit} expected=${EXPECTED_SHA}"

            if test "${build_commit}" = "${EXPECTED_SHA}" && test "${build_status}" = "built"; then
              exit 0
            fi

            if test "${build_commit}" = "${EXPECTED_SHA}" && test "${build_status}" = "errored"; then
              cat latest-build.json
              exit 1
            fi

            sleep 10
          done

          cat latest-build.json
          echo "Pages did not finish the expected build in time."
          exit 1
