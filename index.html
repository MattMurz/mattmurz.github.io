<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profito - System Wycen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">Profito</div>
    <nav>
      <a href="#kalkulator">Kalkulator</a>
      <a href="/miarka/">Miarka A4</a>
      <a href="#realizacje">Realizacje</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Metrówka i Wyceny</h1>
      <p>Szybkie i precyzyjne kosztorysy prac wykończeniowych.</p>
      <p><a class="btn-primary" href="/miarka/">Otwórz Miarkę A4</a></p>
    </section>

    <section id="kalkulator" class="app-module">
      <div class="card">
        <h2>Nowy pomiar</h2>
        <form class="calc-form" id="calcForm">
          <div class="input-group">
            <label for="length">Długość (m)</label>
            <input id="length" name="length" type="number" step="0.01" min="0" placeholder="np. 5.20" required>
          </div>
          <div class="input-group">
            <label for="width">Szerokość (m)</label>
            <input id="width" name="width" type="number" step="0.01" min="0" placeholder="np. 3.10" required>
          </div>
          <button type="submit" class="btn-primary">Oblicz powierzchnię</button>
        </form>
        <div class="result-box" aria-live="polite">
          <span>Wynik:</span>
          <span class="value" id="areaResult">0.00 m²</span>
        </div>
      </div>
    </section>

    <section id="realizacje" class="app-module">
      <div class="card">
        <h2>Miarka A4</h2>
        <p>Wgraj zdjęcie z kartką A4, a moduł pomiarowy Profito spróbuje ją wykryć i wyznaczyć skalę pomiaru.</p>
        <a class="btn-primary" href="/miarka/">Uruchom moduł pomiarowy</a>
      </div>
    </section>
  </main>

  <script>
    document.getElementById('calcForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const length = Number(document.getElementById('length').value);
      const width = Number(document.getElementById('width').value);
      const result = length * width;
      document.getElementById('areaResult').textContent = `${result.toFixed(2)} m²`;
    });
  </script>
</body>
</html>
