<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profito - System Wycen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">Profito</div>
    <nav>
      <a href="#">Kalkulator</a>
      <a href="#">Realizacje</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Metrówka i Wyceny</h1>
      <p>Szybkie i precyzyjne kosztorysy prac wykończeniowych.</p>
    </section>

    <section class="app-module">
      <div class="card">
        <h2>Nowy pomiar</h2>
        <form class="calc-form">
          <div class="input-group">
            <label>Długość (m)</label>
            <input type="number" step="0.01" placeholder="np. 5.20">
          </div>
          <div class="input-group">
            <label>Szerokość (m)</label>
            <input type="number" step="0.01" placeholder="np. 3.10">
          </div>
          <button type="button" class="btn-primary">Oblicz powierzchnię</button>
        </form>
        <div class="result-box">
          <span>Wynik:</span>
          <span class="value">0.00 m²</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
